name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build and package
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="pigo_${os}_${arch}"
              bin="pigo"
              if [ "$os" = windows ]; then
                bin="pigo.exe"
              fi
              # A directory per target keeps the binary at the archive root.
              mkdir -p "build/$name"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
                -o "build/$name/$bin" .
              if [ "$os" = windows ]; then
                (cd "build/$name" && zip -q "../../dist/$name.zip" "$bin")
              else
                tar -czf "dist/$name.tar.gz" -C "build/$name" "$bin"
              fi
            done
          done

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
